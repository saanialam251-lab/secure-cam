# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Faster, cached CI builds.
org.gradle.caching=true
org.gradle.configuration-cache=true
# AndroidX is required by Compose and CameraX.
android.useAndroidX=true
# Needed because some libraries still ship legacy support libs.
android.enableJetifier=false
# Non-transitive R classes speed up builds and shrink APKs.
android.nonTransitiveRClass=true
