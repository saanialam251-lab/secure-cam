name: Build SecureCam APK

# Builds the Android app on every push/PR that touches it, uploads the APK
# as a workflow artifact, and attaches release APKs to GitHub Releases when
# a tag starting with "v" is pushed.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner already ships the Android SDK (ANDROID_HOME).
      # android-actions/setup-android@v3 was failing here with
      # "Failed to find package 'tools'" (removed from sdkmanager), so it is
      # replaced by a plain license-acceptance step.
      - name: Accept Android SDK licenses
        working-directory: .
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      # Prints ONLY the real compiler errors (lines starting with "e: ") so
      # they are easy to copy when the build fails.
      - name: Show compile errors
        if: failure()
        run: |
          echo "=============== COMPILE ERRORS ==============="
          grep -E '^e: |error:|What went wrong|Execution failed|requires' build.log | head -60 || true

      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SecureCam-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/SecureCam-release-unsigned.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/SecureCam-release.apk
          fi
          ls -la artifacts

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureCam-debug-apk
          path: android/artifacts/SecureCam-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureCam-release-apk
          path: android/artifacts/SecureCam-release*.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/artifacts/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
